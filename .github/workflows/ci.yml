name: Build golddrive

on:
  push:
    branches: [ master ]
  workflow_dispatch:

env:
  CACHE_PATH: C:\cache

jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: x64
            configuration: Release
            runs-on: windows-2025
          - platform: ARM64
            configuration: Release
            runs-on: windows-11-arm
    
    runs-on: ${{ matrix.runs-on }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Setup cache directory
        shell: cmd
        run: |
          if not exist C:\cache mkdir C:\cache

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: C:\cache
          key: ${{ runner.os }}-${{ runner.arch }}-cache-${{ hashFiles('**/lockfiles') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-cache-

      - name: Extract version
        id: version
        shell: pwsh
        run: |
          $version = python -c "import re; print(re.search(r'<MyVersion>([0-9\.]+)</MyVersion>.+', open('src\\version.xml').read().replace('\n','')).group(1))"
          echo "VERSION=$version" >> $env:GITHUB_OUTPUT
          echo "Version: $version Configuration: ${{ matrix.configuration }} Platform: ${{ matrix.platform }}"

      - name: Setup MSBuild (Visual Studio 2022)
        uses: microsoft/setup-msbuild@v2
        with:
          vs-version: '[17.0,18.0)'

      - name: Install WinFSP
        shell: cmd
        run: start /wait msiexec /i vendor\winfsp\winfsp-1.12.22339.msi /qn ADDLOCAL=ALL

      - name: Setup WSL
        shell: pwsh
        run: |
          wslconfig /u Ubuntu-18.04
          tools\setup_wsl.ps1

      - name: Install Python dependencies
        shell: cmd
        run: python -m pip install --disable-pip-version-check paramiko

      - name: Setup SSH
        shell: cmd
        run: python tools\setupssh.py support@localhost support

      - name: Build solution
        shell: cmd
        env:
          CONFIGURATION: ${{ matrix.configuration }}
          PLATFORM: ${{ matrix.platform }}
        run: msbuild src\golddrive.sln -p:Configuration=%CONFIGURATION% -p:Platform=%PLATFORM% -p:PlatformToolset=v143 -m /verbosity:normal

      - name: Check build version
        shell: cmd
        env:
          CONFIGURATION: ${{ matrix.configuration }}
          PLATFORM: ${{ matrix.platform }}
        run: src\.build\%CONFIGURATION%\%PLATFORM%\golddrive.exe --version

      - name: Install MSI
        shell: cmd
        env:
          CONFIGURATION: ${{ matrix.configuration }}
          PLATFORM: ${{ matrix.platform }}
          VERSION: ${{ steps.version.outputs.VERSION }}
        run: start /wait msiexec /i src\.build\%CONFIGURATION%\%PLATFORM%\golddrive-%VERSION%-%PLATFORM%.msi /qn

      - name: Verify installation
        shell: cmd
        run: call "c:\Program Files\Golddrive\golddrive.exe" --version

      - name: Run basic tests
        shell: cmd
        run: tools\test.bat

      - name: Mount network drive
        shell: pwsh
        run: |
          net use Z: \\golddrive\support@localhost
          Z:; cd Z:\tmp; echo hello > test.txt; cd

      - name: Run comprehensive tests
        shell: pwsh
        run: |
          $sw = [Diagnostics.Stopwatch]::StartNew()
          C:\projects\golddrive\vendor\fstools\fsx.exe -N 5000 test xxxxxx
          C:\projects\golddrive\vendor\fstools\fsbench-x64.exe --files=100 -rdwr_cc_* -mmap_* -file_attr* -file_list_single* -file_list_none* -rdwr_nc_*
          C:\projects\golddrive\vendor\iozone\iozone.exe -s100m -r2m
          $sw.Stop(); Write-host "Time: " $sw.Elapsed.totalseconds

      - name: Unmount network drive
        if: always()
        shell: pwsh
        run: |
          C:; net use Z: /d
        continue-on-error: true

      - name: Upload MSI artifact
        uses: actions/upload-artifact@v4
        with:
          name: golddrive-${{ steps.version.outputs.VERSION }}-${{ matrix.platform }}-msi
          path: src\.build\${{ matrix.configuration }}\${{ matrix.platform }}\golddrive-*.msi
          if-no-files-found: error

      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: golddrive-${{ steps.version.outputs.VERSION }}-${{ matrix.platform }}-exe
          path: src\.build\${{ matrix.configuration }}\${{ matrix.platform }}\golddrive-*-${{ matrix.platform }}.exe
          if-no-files-found: error
          
name: Build golddrive

on:
  push:
    branches: [ master ]
  workflow_dispatch:

env:
  CACHE_PATH: C:\cache

jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: x64
            configuration: Release
            runs-on: windows-2025
          - platform: ARM64
            configuration: Release
            runs-on: windows-11-arm

    runs-on: ${{ matrix.runs-on }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Setup cache directory
        shell: cmd
        run: |
          if not exist C:\cache mkdir C:\cache

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: C:\cache
          key: ${{ runner.os }}-${{ runner.arch }}-cache-${{ hashFiles('src/**/*.csproj', 'src/version.xml') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-cache-

      - name: Extract version
        id: version
        shell: pwsh
        run: |
          $version = python -c "import re; print(re.search(r'<MyVersion>([0-9\.]+)</MyVersion>.+', open('src\\version.xml').read().replace('\n','')).group(1))"
          echo "VERSION=$version" >> $env:GITHUB_OUTPUT
          echo "Version: $version Configuration: ${{ matrix.configuration }} Platform: ${{ matrix.platform }}"

      - name: Setup MSBuild (Visual Studio 2022)
        uses: microsoft/setup-msbuild@v2
        with:
          vs-version: '[17.0,18.0)'

      - name: Install WinFSP
        shell: cmd
        run: start /wait msiexec /i vendor\winfsp\winfsp-1.12.22339.msi /qn ADDLOCAL=ALL

      - name: Setup WSL
        uses: Vampire/setup-wsl@v3
        with:
          distribution: Ubuntu-18.04

      - name: Configure WSL
        shell: pwsh
        run: |
          wslconfig /u Ubuntu-18.04
          tools\setup_wsl.ps1

      - name: Install Python dependencies
        shell: cmd
        run: python -m pip install --disable-pip-version-check paramiko

      - name: Create SSH directory
        shell: cmd
        run: |
          if not exist %USERPROFILE%\.ssh mkdir %USERPROFILE%\.ssh

      - name: Setup SSH
        shell: cmd
        env:
          PLATFORM: ${{ matrix.platform }}
          SSH_TEST_PASSWORD: ${{ secrets.SSH_TEST_PASSWORD || 'support' }}
        run: python tools\setupssh.py support@localhost %SSH_TEST_PASSWORD%

      - name: Build CLI
        shell: cmd
        env:
          CONFIGURATION: ${{ matrix.configuration }}
          PLATFORM: ${{ matrix.platform }}
        run: msbuild src\cli\cli.vcxproj /t:rebuild /p:Configuration=%CONFIGURATION% /p:Platform=%PLATFORM% /p:SolutionDir=%CD%\src\ /v:minimal

      - name: Build App
        shell: cmd
        env:
          CONFIGURATION: ${{ matrix.configuration }}
          PLATFORM: ${{ matrix.platform }}
        run: dotnet build src\app\app.csproj -c %CONFIGURATION% -o build\%CONFIGURATION%\%PLATFORM%

      - name: Build Tests
        shell: cmd
        env:
          CONFIGURATION: ${{ matrix.configuration }}
          PLATFORM: ${{ matrix.platform }}
        run: dotnet build src\test\test.csproj -c %CONFIGURATION% -o build\%CONFIGURATION%\%PLATFORM%

      - name: Check build version
        shell: cmd
        env:
          CONFIGURATION: ${{ matrix.configuration }}
          PLATFORM: ${{ matrix.platform }}
        run: build\%CONFIGURATION%\%PLATFORM%\golddrive.exe --version

      - name: Install Inno Setup
        shell: cmd
        run: choco install innosetup --version=6.2.2 -y --no-progress

      - name: Build installer
        shell: cmd
        env:
          CONFIGURATION: ${{ matrix.configuration }}
          PLATFORM: ${{ matrix.platform }}
          VERSION: ${{ steps.version.outputs.VERSION }}
        run: |
          "%ProgramFiles(x86)%\Inno Setup 6\ISCC.exe" /DMyAppVersion=%VERSION% /DMyPlatform=%PLATFORM% /DMyConfiguration=%CONFIGURATION% installer\setup.iss

      - name: Install golddrive
        shell: cmd
        env:
          CONFIGURATION: ${{ matrix.configuration }}
          PLATFORM: ${{ matrix.platform }}
          VERSION: ${{ steps.version.outputs.VERSION }}
        run: build\%CONFIGURATION%\%PLATFORM%\golddrive-%VERSION%-%PLATFORM%-setup.exe /VERYSILENT /SUPPRESSMSGBOXES /NORESTART

      - name: Verify installation
        shell: cmd
        run: call "c:\Program Files\Golddrive\golddrive.exe" --version

      - name: Run basic tests
        shell: cmd
        run: tools\test.bat

      - name: Mount network drive
        shell: pwsh
        run: |
          net use Z: \\golddrive\support@localhost
          Z:; cd Z:\tmp; echo hello > test.txt; cd

      - name: Run comprehensive tests
        shell: pwsh
        run: |
          $sw = [Diagnostics.Stopwatch]::StartNew()
          vendor\fstools\fsx.exe -N 5000 test xxxxxx
          vendor\fstools\fsbench-x64.exe --files=100 -rdwr_cc_* -mmap_* -file_attr* -file_list_single* -file_list_none* -rdwr_nc_*
          vendor\iozone\iozone.exe -s100m -r2m
          $sw.Stop(); Write-host "Time: " $sw.Elapsed.totalseconds

      - name: Unmount network drive
        if: always()
        shell: pwsh
        run: |
          C:; net use Z: /d
        continue-on-error: true

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: golddrive-${{ steps.version.outputs.VERSION }}-${{ matrix.platform }}-setup
          path: build\${{ matrix.configuration }}\${{ matrix.platform }}\golddrive-*-setup.exe
          if-no-files-found: error
          retention-days: 90
